# herdr configuration
# Ported from ~/.config/tmux/tmux.conf
# Reload: prefix+shift+r  or  herdr server reload-config
# Validate: herdr config check

onboarding = false

[theme]
name = "catppuccin"

# Mocha values to match ghostty's "Catppuccin Mocha" theme
[theme.custom]
accent   = "#fab387" # peach (was window-status-current fg)
# herdr paints no background, it inherits ghostty's (opacity 0.9 + blur), so
# dividers must be bright enough to read against any wallpaper behind it.
panel_bg = "reset"
red      = "#f38ba8"
green    = "#a6e3a1"
# border/divider tokens (tmux pane-border-style used @thm_overlay0)
surface0 = "#313244" # unfocused tab background
surface1 = "#45475a"
overlay0 = "#6c7086"
overlay1 = "#7f849c"

# Divider between sidebar and panes is NOT themeable in 0.7.5: verified every
# [theme.custom] token (accent, panel_bg, surface0/1, overlay0/1, text,
# subtext0, mauve, blue, teal, yellow, peach, red, green) leaves it unchanged.
# Only [theme] name moves it.

[terminal]
default_shell = "/opt/homebrew/bin/fish"
new_cwd = "follow" # tmux: -c "#{pane_current_path}"

[keys]
prefix = "ctrl+space"

# tmux prefix+p / prefix+n window cycling
previous_tab = "prefix+p"
next_tab = "prefix+n"

# tmux prefix+; last-pane
last_pane = "prefix+semicolon"

# workspace nav without arrows: prefix+shift+1..9 jumps by sidebar index.
# prefix+w (picker) and prefix+g (goto) are defaults, no config needed.
switch_workspace = "prefix+shift+1..9"

# cyclic workspace nav. shift+j/k are taken by swap_pane, so alt+j/k.
previous_workspace = "prefix+alt+k"
next_workspace = "prefix+alt+j"

# picker/sidebar cycling: shift+J/K instead of the default arrow keys
navigate_workspace_down = "shift+j"
navigate_workspace_up = "shift+k"

# destructive: git worktree remove on the focused workspace. Confirmation
# dialog still applies. Steals the default close_tab binding, which moves to
# prefix+shift+q (tabs are cheap, worktrees are the thing worth a chord).
remove_worktree = "prefix+shift+x"
close_tab = "prefix+shift+q"

# open an existing worktree. Unset by default. Sits next to new_worktree
# (prefix+shift+g); prefix+g is taken by goto, so ctrl instead of shift.
open_worktree = "prefix+ctrl+g"

# splits: tmux % / " have no key-name equivalent, defaults kept
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"

# vim-tmux-navigator replacement (herdr-splits.nvim)
# ctrl+hjkl, same as the old tmux root bindings. herdr-nav.sh checks the
# focused pane: nvim gets the chord forwarded (nvim owns in-split movement and
# edge crossing), anything else moves herdr pane focus. Cost is the same as
# under tmux: ctrl+k/ctrl+l no longer reach fish or Claude Code.
# Resize: use prefix+r (resize_mode).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[ui]
mouse_capture = true
copy_on_select = true

# tmux-like splits: single shared border, no gap
pane_borders = true
pane_gaps = false

prompt_new_tab_name = false
prompt_new_workspace_name = false

# collapsed sidebar takes zero width instead of leaving a status rail
sidebar_collapsed_mode = "hidden"

agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]
row_gap = 1 # blank lines between workspace entries (default 0)

[session]
resume_agents_on_restore = true

[advanced]
scrollback_limit_bytes = 10000000

[experimental]
switch_ascii_input_source_in_prefix = false
